[General]
; Input mode:
; siapi     - (Default) Uses SIAPI SteamTouchPad analog action with camera detour.
;             Leaves NxInputImpl vanilla (0 NOP patches); 100% native Gamepad mode, works in Photo Mode.
; raw_mouse - (Legacy) Uses 12 binary NOP patches in NxInputImpl to unblock simultaneous OS mouse input.
mode = siapi

[Debug]
; Log level: debug, info, warn, error, off (default: info)
; Controls the verbosity of mixed_input_fix.log (set to 'off' to disable logging completely)
log_level = info
