name: Build & Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows x64 DLL
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache MinGW APT Packages
        id: apt-cache
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-mingw-x86-64-v1

      - name: Install MinGW toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-mingw-w64-x86-64

      - name: Determine Version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "TAG_NAME=${{ github.ref_name }}" >> "$GITHUB_ENV"
          else
            echo "TAG_NAME=$(git describe --tags --always --dirty 2>/dev/null || echo dev)" >> "$GITHUB_ENV"
          fi

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=cmake/mingw64-toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DMOD_VERSION="${{ env.TAG_NAME }}"

      - name: Build Package
        run: |
          cmake --build build --target package_zip

      - name: Upload Artifacts (Actions)
        uses: actions/upload-artifact@v4
        with:
          name: hfw-mixed-input-${{ env.TAG_NAME }}
          path: |
            build/hfw-mixed-input-${{ env.TAG_NAME }}.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/hfw-mixed-input-${{ env.TAG_NAME }}.zip
          generate_release_notes: true
